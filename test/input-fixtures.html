<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Message Input Bot — Test Fixtures</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }

      h1 {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
      }

      p.hint {
        color: #666;
        font-size: 0.875rem;
        margin-bottom: 2rem;
      }

      section {
        margin-bottom: 2rem;
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      section h2 {
        font-size: 0.875rem;
        margin: 0 0 0.75rem;
        color: #444;
      }

      input[type='text'],
      textarea {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      [contenteditable='true'] {
        min-height: 40px;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        outline: none;
      }

      [contenteditable='true']:focus {
        border-color: #4a90d9;
      }

      .chat-box {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .chat-messages {
        min-height: 120px;
        max-height: 200px;
        overflow-y: auto;
        padding: 0.5rem;
        background: #f5f5f5;
        border-radius: 4px;
        font-size: 0.875rem;
      }

      .chat-messages .msg {
        margin-bottom: 0.25rem;
      }

      .chat-input-row {
        display: flex;
        gap: 0.5rem;
      }

      .chat-input-row [contenteditable='true'] {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h1>Message Input Bot — 本地测试页</h1>
    <p class="hint">
      Focus 任意输入框，应出现右上角小按钮。配置重复内容后观察输入与 Enter
      行为。
    </p>

    <section>
      <h2>&lt;input type="text"&gt;</h2>
      <input
        type="text"
        placeholder="在此输入..."
      />
    </section>

    <section>
      <h2>&lt;textarea&gt;</h2>
      <textarea placeholder="在此输入..."></textarea>
    </section>

    <section>
      <h2>&lt;div contenteditable="true"&gt;</h2>
      <div
        contenteditable="true"
        data-placeholder="在此输入..."
      ></div>
    </section>

    <section>
      <h2>模拟聊天框（Enter 提交消息）</h2>
      <div class="chat-box">
        <div
          id="chat-messages"
          class="chat-messages"
        ></div>
        <div class="chat-input-row">
          <div
            id="chat-input"
            contenteditable="true"
            data-placeholder="输入消息，Enter 发送..."
          ></div>
        </div>
      </div>
    </section>

    <script>
      const chatInput = document.getElementById('chat-input');
      const chatMessages = document.getElementById('chat-messages');

      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const text = chatInput.textContent.trim();
          if (text) {
            const msg = document.createElement('div');
            msg.className = 'msg';
            msg.textContent = text;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }
          chatInput.textContent = '';
        }
      });
    </script>
  </body>
</html>
